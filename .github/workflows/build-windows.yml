name: Build Windows Executable

on:
  push:
    branches: [v1, main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name PQR_Report_Generator --add-data "templates;templates" --add-data "static;static" --hidden-import=flask --hidden-import=flask_cors --hidden-import=docx app.py
    
    - name: Create deployment package
      run: |
        mkdir deployment
        copy dist\PQR_Report_Generator.exe deployment\
        copy INSTALL_SERVICE.bat deployment\
        copy UNINSTALL_SERVICE.bat deployment\
        copy DEPLOYMENT.md deployment\README.txt
        echo Download nssm from https://nssm.cc/download and place nssm.exe in this folder > deployment\IMPORTANT.txt
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PQR-Report-Generator-Windows
        path: deployment/
        retention-days: 90
    
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          deployment/PQR_Report_Generator.exe
          deployment/INSTALL_SERVICE.bat
          deployment/UNINSTALL_SERVICE.bat
          deployment/README.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
